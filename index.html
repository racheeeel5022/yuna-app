<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>윤아의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{
    --ink:#3a3350; --ink2:#8b84a3; --line:#eae6f5; --paper:#f9f7fe;
    --card:#ffffff; --violet:#8b6ee0; --violet-soft:#f0ebfd; --violet-ink:#6849c0;
    --gold:#c99a2e; --gold-soft:#fbf1d8; --ivory:#f2eefa;
    --done:#5aa672; --done-soft:#e6f2e8; --red:#e0728a; --red-soft:#fbe6ec;
    --shadow:0 2px 14px rgba(120,90,200,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.5;padding-bottom:90px;}
  /* Netlify 광고 배지 숨김 */
  [class*="netlify"],[id*="netlify-badge"],.netlify-badge,#netlify-badge,
  div[style*="netlify"],a[href*="netlify.com"][target="_blank"]{display:none !important;}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px;}

  header{padding:20px 18px 8px;position:relative;}
  .hello-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .hello-txt{text-align:left;}
  .hello-hi{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.2;}
  .hello-hi .spark{font-size:17px;}
  .hello-date{font-size:12.5px;color:var(--ink2);margin-top:4px;font-weight:600;letter-spacing:-.01em;}
  .hello-date .dow{color:var(--violet);font-weight:800;}
  .avatar-img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;
    box-shadow:0 3px 10px rgba(109,92,224,.22);flex:0 0 auto;}
  .weekstrip{display:flex;gap:2px;margin-top:16px;justify-content:space-between;}
  .weekstrip .wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;}
  .weekstrip .wl{font-size:12px;font-weight:600;color:#b0a89c;letter-spacing:.01em;}
  .weekstrip .today .wl{color:var(--ink);font-weight:700;}
  .weekstrip .wn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--ink);}
  .weekstrip .today .wn{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 5px 14px rgba(139,110,224,.35);}
  .whoami{position:absolute;right:16px;top:22px;font-size:12px;color:var(--violet-ink);
    background:var(--violet-soft);border-radius:20px;padding:5px 11px;font-weight:700;}

  .progress-card{background:linear-gradient(135deg,#8b6ee0 0%,#a68ceb 100%);
    color:#fff;border-radius:24px;padding:20px 22px;margin:6px 0 16px;box-shadow:0 10px 24px rgba(139,110,224,.28);}
  .progress-card .lab{font-size:13px;font-weight:600;opacity:.92;letter-spacing:.01em;}
  .progress-card .big{font-size:32px;font-weight:800;margin-top:3px;letter-spacing:-.02em;}
  .bar{height:7px;background:rgba(255,255,255,.32);border-radius:8px;margin-top:14px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:#fff;border-radius:8px;width:0;transition:width .5s ease;}

  .park-btn{width:100%;display:flex;align-items:center;gap:13px;background:#fff;border:1.5px solid #f4e4c0;border-radius:20px;padding:15px 17px;margin-bottom:14px;font-family:inherit;text-align:left;box-shadow:0 3px 14px rgba(200,160,70,.1);position:relative;}
  .park-ico{width:40px;height:40px;flex:0 0 auto;border-radius:13px;background:#fdf2d8;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .park-t{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
  .park-s{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.4;}
  .park-badge{position:absolute;top:-6px;right:-6px;background:#f0885f;color:#fff;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(240,136,95,.4);}
  .park-list{margin-top:6px;}
  .park-item{display:flex;align-items:flex-start;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
  .park-item .pt{flex:1;font-size:14px;color:var(--ink);line-height:1.5;}
  .park-item .px{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:0;background:var(--red-soft);color:var(--red);font-size:15px;font-weight:700;}

  .tabs{display:flex;gap:4px;margin:0 0 18px;background:#f1ebdf;padding:5px;border-radius:16px;}

  .viewing-banner{background:var(--violet-soft);color:var(--violet-ink);border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;}
  .viewing-banner b{font-weight:800;}
  .ysum{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 17px;margin-bottom:14px;box-shadow:0 2px 12px rgba(120,90,200,.05);}
  .ysum-h{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-bottom:10px;}
  .ysum-row{display:flex;gap:8px;margin-bottom:6px;}
  .ysum-tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;}
  .ysum-tag.ok{background:var(--done-soft);color:var(--done);}
  .ysum-tag.no{background:var(--red-soft);color:var(--red);}
  .ysum-sub{font-size:12.5px;font-weight:700;color:var(--ink2);margin:10px 0 4px;}
  .ysum-item{font-size:13.5px;line-height:1.6;padding-left:2px;}
  .ysum-item.miss{color:var(--red);}
  .ysum-item.ok{color:var(--ink2);}

  .cheer-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);z-index:80;
    opacity:0;pointer-events:none;transition:opacity .25s cubic-bezier(.34,1.56,.64,1),transform .25s cubic-bezier(.34,1.56,.64,1);}
  .cheer-pop.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .cheer-pop-inner{background:#fff;border:1.5px solid #f6e6c4;
    border-radius:26px;padding:24px 28px;text-align:center;box-shadow:0 16px 40px rgba(200,160,70,.28);max-width:290px;}
  .cheer-pop-em{font-size:38px;animation:bounce .5s ease;}
  .cheer-pop-en{font-weight:700;font-size:17px;color:#e0a83e;
    margin-top:8px;line-height:1.35;letter-spacing:-.01em;}
  .cheer-pop-ko{font-size:14px;font-weight:600;color:var(--ink2);margin-top:8px;line-height:1.45;}
  @keyframes bounce{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .tabs button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:12.5px;
    font-weight:600;padding:10px 4px;border-radius:12px;font-family:inherit;transition:.15s;letter-spacing:-.01em;}
  .tabs button.on{background:#fff;color:var(--violet-ink);box-shadow:0 2px 8px rgba(160,130,80,.12);font-weight:700;}

  .sec-title{font-size:13px;font-weight:800;color:var(--ink2);margin:18px 4px 8px;
    display:flex;align-items:center;gap:6px;letter-spacing:.02em;}

  .item{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:13px 15px;margin-bottom:10px;box-shadow:0 2px 12px rgba(160,130,80,.05);transition:.15s;}
  .item.cat-v,.item.cat-g,.item.cat-r{background:#fff;}
  .item.done{background:#f4faf5;border-color:#d3ecd8;}
  .item.carry{background:#fff;border-color:#f2c9b5;}
  .icobox{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;}
  .time-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding-left:6px;}
  .time-col span{font-size:11px;font-weight:600;color:#a99f90;white-space:nowrap;}
  .kk-btn{margin-top:7px;display:inline-flex;align-items:center;gap:5px;background:#f2eee2;color:#8a7a4a;border:0;border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;font-family:inherit;}
  .carrytag{display:inline-block;font-size:11px;font-weight:800;color:var(--red);background:var(--red-soft);padding:2px 8px;border-radius:20px;margin:4px 0 2px;}
  .check{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid #e2dccf;
    background:#fff;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .item.done .check{background:var(--violet);border-color:var(--violet);}
  .check svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.15s;}
  .item.done .check svg{opacity:1;}
  .item .body{flex:1;min-width:0;}
  .item .ttl{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.35;}
  .badge-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
  .item{align-items:flex-start;}
  .time-col{align-self:center;}
  .ttl-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .dd{flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.01em;}
  .dd-over{background:var(--red);color:#fff;}
  .dd-today{background:var(--red);color:#fff;}
  .dd-soon{background:#ffe4c4;color:#b46a12;}
  .dd-far{background:var(--violet-soft);color:var(--violet-ink);}
  .due{font-size:12px;color:var(--ink2);margin-top:3px;font-weight:600;}
  .item.done .ttl{color:var(--done);text-decoration:line-through;text-decoration-color:rgba(47,158,111,.5);}
  .item .rng{font-size:13px;color:var(--ink2);margin-top:2px;word-break:break-word;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;margin-top:6px;}
  .chips-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .timechip{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;margin-top:6px;background:#fff;color:#77839c;border:1px solid #e7e9f2;}
  .tag.v{background:#e7ddfb;color:#6849c0;}
  .tag.g{background:#cfe8cf;color:#3f8a5e;}
  .tag.r{background:#f8d3de;color:#c85172;}
  .locked .check{opacity:.35;}

  .grid-cell .item{cursor:default;}
  .day-block{margin-bottom:6px;}
  .day-name{font-size:13px;font-weight:800;color:var(--violet-ink);margin:14px 4px 6px;}
  .slot{display:flex;gap:10px;font-size:14px;padding:7px 12px;border-bottom:1px dashed var(--line);}
  .slot .t{flex:0 0 82px;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:13px;}
  .slot .a{flex:1;font-weight:600;}

  .backlog .item{align-items:center;}
  .backlog .pct{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--red);}
  .mini-bar{height:6px;background:var(--red-soft);border-radius:6px;margin-top:7px;overflow:hidden;}
  .mini-bar > i{display:block;height:100%;background:var(--red);border-radius:6px;transition:width .4s;}

  .empty{text-align:center;color:var(--ink2);font-size:14px;padding:30px 10px;}
  .celebrate{text-align:center;padding:26px 10px;}
  .celebrate .em{font-size:40px;}
  .celebrate p{font-weight:800;color:var(--done);margin:6px 0 0;font-size:16px;}

  .role-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);
    backdrop-filter:saturate(160%) blur(10px);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:40;}
  .role-bar button{flex:1;max-width:150px;border:1px solid var(--line);background:#fff;
    border-radius:12px;padding:11px;font-size:13px;font-weight:700;color:var(--ink2);font-family:inherit;}
  .role-bar button.on{background:var(--violet);color:#fff;border-color:var(--violet);}

  .fab{position:fixed;right:18px;bottom:calc(70px + env(safe-area-inset-bottom));width:54px;height:54px;
    border-radius:50%;background:var(--violet);color:#fff;border:0;font-size:26px;box-shadow:0 6px 18px rgba(109,92,224,.4);
    display:none;align-items:center;justify-content:center;z-index:45;}
  .fab.show{display:flex;}

  .modal-bg{position:fixed;inset:0;background:rgba(43,39,64,.45);display:none;align-items:flex-end;
    justify-content:center;z-index:60;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:86vh;overflow:auto;}
  .modal h3{margin:0 0 14px;font-size:17px;font-weight:800;}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 5px;}
  .modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);border-radius:11px;
    padding:11px;font-size:15px;font-family:inherit;background:var(--paper);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;
    font-size:13px;font-weight:700;color:var(--ink2);font-family:inherit;}
  .chips button.on{background:var(--violet);color:#fff;border-color:var(--violet);}
  .m-actions{display:flex;gap:8px;margin-top:18px;}
  .m-actions button{flex:1;border-radius:12px;padding:13px;font-size:15px;font-weight:800;border:0;font-family:inherit;}
  .btn-save{background:var(--violet);color:#fff;}
  .btn-cancel{background:var(--ivory);color:var(--ink2);}
  .admin-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .admin-row .x{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:0;background:var(--red-soft);
    color:var(--red);font-size:16px;font-weight:800;}
  .status{text-align:center;font-size:12px;color:var(--ink2);padding:6px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9c4d8;margin-right:5px;vertical-align:middle;}
  .dot.live{background:var(--done);}
  .setup{background:var(--gold-soft);border:1px solid #eeddb0;border-radius:14px;padding:14px;margin:14px 0;font-size:13px;color:#7a5f18;line-height:1.6;}
  .setup b{color:#5f4a11;}
</style>
</head>

// Firebase 연결 (설정 있으면 실시간, 없으면 로컬 데모) ----------------
async function initFirebase(){
  loadLocal();  // 우선 화면부터 띄운다 (Firebase가 늦거나 실패해도 앱은 보임)
  if(firebaseConfig.apiKey === '여기에_붙여넣기'){
    setStatus(false,'데모 모드 — Firebase 설정 전. 이 기기에만 저장돼요.');
    return;
  }
  try{
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const fsMod  = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    fb = fsMod;
    const app = appMod.initializeApp(firebaseConfig);
    db = fsMod.getFirestore(app);
    fsMod.onSnapshot(fsMod.doc(db,'yuna','data'), (snap)=>{
      if(snap.exists()){ const d=snap.data();
        if(d.tasks) state.tasks=d.tasks; if(d.backlog) state.backlog=d.backlog; if(d.parking) state.parking=d.parking; }
      setStatus(true,'실시간 연결됨 · 셋이 공유 중');
      render(); }, ()=> setStatus(false,'연결 오류 — 새로고침 해보세요'));
    fsMod.onSnapshot(fsMod.doc(db,'yuna','checks'), (snap)=>{
      state.checks = snap.exists()? (snap.data().map||{}) : {}; render();
      setStatus(true,'실시간 연결됨 · 셋이 공유 중'); },
      ()=> setStatus(false,'연결 오류 — 새로고침 해보세요'));
    live=true;
  }catch(e){ setStatus(false,'Firebase 로딩 실패 — 로컬 저장으로 작동 중'); }
}
function setStatus(isLive,txt){ live=isLive;
  document.getElementById('liveDot').classList.toggle('live',isLive);
  document.getElementById('statusText').textContent=txt; }

// 로컬 저장 (데모 모드) ------------------------------------------
function loadLocal(){
  const s=localStorage.getItem('yuna_state'); if(s){ const j=JSON.parse(s); state.tasks=j.tasks||state.tasks; state.backlog=j.backlog||state.backlog; state.parking=j.parking||[]; }
  const c=localStorage.getItem('yuna_checks'); state.checks=c?JSON.parse(c):{};
  render();
}
function saveLocal(){ localStorage.setItem('yuna_state',JSON.stringify({tasks:state.tasks,backlog:state.backlog,parking:state.parking}));
  localStorage.setItem('yuna_checks',JSON.stringify(state.checks)); }

// 저장 (Firebase or 로컬) ---------------------------------------
async function saveChecks(){
  if(db&&fb){ try{ await fb.setDoc(fb.doc(db,'yuna','checks'),{map:state.checks}); }catch(e){ saveLocal(); } }
  else saveLocal();
}
async function saveTasks(){
  if(db&&fb){ try{ await fb.setDoc(fb.doc(db,'yuna','data'),{tasks:state.tasks,backlog:state.backlog,parking:state.parking}); }catch(e){ saveLocal(); } }
  else saveLocal();
  render();
}

// 완료 판정: 반복 항목은 '오늘 완료'만 완료로 침(다음날 리셋), 일반은 체크되면 완료
function taskDone(t){
  if(!state.checks[t.id]) return false;
  if(t.repeat) return state.checks[t.id]===todayKey();  // 반복: 오늘 체크한 것만
  return true;                                          // 일반: 체크되면 완료
}

// 오늘 할 일 = 미완료 항목 (오늘 요일 + 마감 지난 미완료 이월) ---------
function todayTasks(){
  // 선택한 날짜(없으면 오늘)
  const viewDate = selectedDate ? new Date(selectedDate+'T00:00:00') : new Date();
  viewDate.setHours(0,0,0,0);
  const d = viewDate.getDay();
  const isPast = selectedDate && (viewDate < new Date(new Date().setHours(0,0,0,0)));
  const isDone = t => taskDone(t);
  const list = state.tasks.filter(t=>{
    const onDay = (t.days||[]).includes(d);
    if(selectedDate){
      // 특정 날짜 보기: 그날 요일에 있던 항목 전부 (완료 여부 상관없이 그날 기록 표시)
      return onDay;
    }
    // 오늘 보기: 완료 제외 + 마감 지난 미완료 이월
    if(isDone(t)) return false;
    const overdue = t.due && (new Date(t.due+'T00:00:00') < viewDate);
    return onDay || overdue;
  });
  list.forEach(t=>{
    t._carry = !selectedDate && t.due && (new Date(t.due+'T00:00:00') < viewDate);
  });
  const isUrgent = t => t.tag==='r' || t._carry;
  const dueVal = t => t.due ? new Date(t.due+'T00:00:00').getTime() : Infinity;
  const timeVal = t => t.time ? parseInt(t.time.replace(':',''),10) : 9999;
  return list.sort((a,b)=>{
    // 0) 상단 고정(pin) 먼저
    if(!!a.pin!==!!b.pin) return a.pin? -1 : 1;
    const au=isUrgent(a), bu=isUrgent(b);
    if(au!==bu) return au? -1 : 1;
    if(au&&bu) return dueVal(a)-dueVal(b);
    return timeVal(a)-timeVal(b);
  });
}

// 완료 항목 중 마감 지난 것 자동 삭제 ---------------------------
function cleanupDone(){
  const today = new Date(); today.setHours(0,0,0,0);
  let changed=false;
  state.tasks.forEach(t=>{
    const doneOn = state.checks[t.id];
    if(doneOn && typeof doneOn==='string'){
      // 완료한 날로부터 3일 지난 것만 정리 (당일·최근 완료는 유지)
      const dd=new Date(doneOn+'T00:00:00');
      const days=Math.round((today-dd)/86400000);
      if(days>=3){ delete state.checks[t.id]; changed=true; }
    }
  });
  if(changed) saveChecks();
}

// 주간 달력 스트립 (이번 주 월~일, 오늘 강조) --------------------
function renderWeekStrip(d){
  const el=document.getElementById('weekstrip'); if(!el) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const base=new Date(d); base.setHours(0,0,0,0);
  const sel = selectedDate ? new Date(selectedDate+'T00:00:00') : today;
  const dow0=base.getDay();
  const monOffset = dow0===0? -6 : 1-dow0;
  const mon=new Date(base); mon.setDate(base.getDate()+monOffset);
  const L=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html='';
  for(let i=0;i<7;i++){
    const dd=new Date(mon); dd.setDate(mon.getDate()+i);
    const key=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
    const isSel = dd.getTime()===sel.getTime();
    html+=`<div class="wday ${isSel?'today':''}" onclick="pickDate('${key}')"><div class="wl">${L[i]}</div><div class="wn">${dd.getDate()}</div></div>`;
  }
  el.innerHTML=html;
}

};

function renderDone(){

  else {
    doneList.sort((a,b)=> (state.checks[b.id]||'').localeCompare(state.checks[a.id]||''));
    doneHTML = `<div class="ysum-sub" style="margin-top:16px;">✅ 완료한 숙제</div>` + doneList.map(t=>{
      const when = state.checks[t.id];

          <div class="due">✅ ${wd}</div>
        </div></div>`;
    }).join('');
  }
  el.innerHTML = yHTML + doneHTML;
}
function ddayInfo(due){
  if(!due) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const d=new Date(due+'T00:00:00');
  const diff=Math.round((d-now)/86400000);
  let label;
  if(diff<0) label = '지남';           // 마감 지남
  else if(diff===0) label = '오늘';     // 오늘 마감
  else if(diff===1) label = '내일';     // 내일 마감
  else label = 'D-'+diff;               // 모레 이후만 D-day
  const dueTxt = `${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]})`;
  // 색상: 지남/오늘=빨강, 내일=주황, 모레이후=보라
  let cls = diff<0?'dd-over' : diff===0?'dd-today' : diff===1?'dd-soon' : 'dd-far';
  return { label, dueTxt, cls };
}

// 카테고리별 아이콘 + 박스 색 (학교/학원/밀림) --------------------
function taskIcon(t){
  if(t._carry) return ['⚠️','#fbe6ec'];        // 이월된 것도 밀림 취급
  if(t.tag==='v') return ['📚','#f0ebfd'];      // 학교/필수 (보라)
  if(t.tag==='g') return ['✏️','#eaf4ea'];      // 학원/연습 (민트)
  return ['⚠️','#fbe6ec'];                       // 밀림/급함 (핑크)
}

function cardHTML(t){
  const on = selectedDate ? (state.checks[t.id]===selectedDate) : !!state.checks[t.id];
  const lock = role!=='yuna' || !!selectedDate;   // 과거 날짜는 체크 잠금
  const [ico,icobg] = taskIcon(t);
  const kkBtn = t.kk ? `<button onclick="event.stopPropagation();openKkg(event)" class="kk-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.5-2.5v9L15 14"/><rect x="2" y="6" width="13" height="12" rx="2"/></svg>꾸그 열기</button>` : '';
  const dd = ddayInfo(t.due);
  const ddBadge = dd && !on ? `<span class="dd ${dd.cls}">${dd.label}</span>` : '';
  const carryTag = t._carry ? `<span class="carrytag">지난 숙제</span>` : '';
  const catTxt = t._carry?'밀림' : t.tag==='v'?'학교':t.tag==='g'?'학원':'밀림';
  const catTag = `<span class="tag ${t._carry?'r':t.tag}">${catTxt}</span>`;
  const topBadges = (ddBadge||carryTag) ? `<div class="badge-row">${ddBadge}${carryTag}</div>` : '';
  const timeCol = t.time ? `<div class="time-col"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b7aea0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg><span>${t.time}</span></div>` : '';
  return `<div class="item cat-${t.tag} ${on?'done':''} ${lock?'locked':''} ${t._carry?'carry':''}" onclick="toggleCheck('${t.id}')">
    <div class="check">${checkSVG()}</div>
    <div class="icobox" style="background:${icobg}">${ico}</div>
    <div class="body">
      ${topBadges}
      <div class="ttl">${esc(t.title)}</div>
      ${t.range?`<div class="rng">${esc(t.range)}</div>`:''}
      <div class="chips-row">${catTag}</div>
      ${kkBtn}
    </div>
    ${timeCol}
  </div>`;
}

function renderWeek(){
  const el=document.getElementById('view-week');
  const names={1:'월요일',2:'화요일',3:'수요일',4:'목요일',5:'금요일',6:'토요일',0:'일요일'};
  let html='';
  [1,2,3,4,5,6,0].forEach(dnum=>{
    const rows=WEEK[dnum]||[]; const isToday = dnum===dow();
    html+=`<div class="day-block"><div class="day-name">${names[dnum]}${isToday?' · 오늘':''}</div>`;
    rows.forEach(r=> html+=`<div class="slot"><div class="t">${r[0]}</div><div class="a">${esc(r[1])}</div></div>`);
    html+='</div>';
  });
  el.innerHTML=html;
}

function renderBacklog(){
  const el=document.getElementById('view-backlog');
  if(!state.backlog.length){ el.innerHTML='<div class="empty">밀린 과제가 없어요. 잘하고 있어요!</div>'; return; }
  el.innerHTML = '<div class="backlog">'+state.backlog.map(b=>`
    <div class="item">
      <div class="body">
        <div class="ttl">${esc(b.title)}</div>
        <div class="mini-bar"><i style="width:${b.pct||0}%"></i></div>
      </div>
      <div class="pct">${b.pct||0}%</div>
    </div>`).join('')+'</div>'
    + (role==='parent'?'<div class="sec-title" style="margin-top:16px">엄마: + 버튼으로 항목·진행률 수정</div>':'');
}

const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- 탭 / 역할 ----------
window.switchTab=(t)=>{ tab=t;
  ['today','done','week','backlog'].forEach(x=>{
    document.getElementById('view-'+x).style.display = x===t?'block':'none';
    document.querySelector(`.tabs button[data-tab="${x}"]`).classList.toggle('on',x===t);
  });
  document.getElementById('fab').classList.toggle('show', role==='parent' && t!=='week');
  const pb=document.getElementById('parentBar');
  if(pb) pb.style.display = (role==='parent' && t==='today') ? 'block' : 'none';
};
const PARENT_PW = '3578';  // 엄마·아빠 비밀번호
window.setRole=(r)=>{
  if(r==='parent'){
    // 매번 비밀번호 확인
    const input = prompt('엄마·아빠 비밀번호를 입력하세요');
    if(input===null) return;                          // 취소
    if(input!==PARENT_PW){ alert('비밀번호가 맞지 않아요'); return; }
  }
  role=r; render();   // 역할을 저장하지 않음 → 앱 새로 열면 항상 윤아 모드
};

// 클래스룸 갱신 요청 문구 복사 (부모 모드) -----------------------
window.resetToFile=(btn)=>{
  if(!confirm('이 파일의 최신 숙제 목록으로 새로고침할까요?\n\n· 숙제 목록이 파일 기준으로 바뀝니다\n· 윤아의 완료 체크는 그대로 유지됩니다')) return;
  const span=btn.querySelector('span');
  state.tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
  state.backlog = JSON.parse(JSON.stringify(DEFAULT_BACKLOG));
  saveTasks();  // Firebase(또는 로컬)에 덮어쓰기, 체크는 건드리지 않음
  span.textContent='최신 숙제로 새로고침 완료!';
  setTimeout(()=>{ span.textContent='이 파일의 최신 숙제로 새로고침'; },2200);
};

// 꾸그 화상수업 앱 열기 (없으면 앱스토어) ------------------------
window.openKkg=(e)=>{
  e.preventDefault();
  const store='https://apps.apple.com/kr/app/%EA%BE%B8%EA%B7%B8/id1575300311';
  const t=Date.now();
  // 꾸그 앱 실행 시도 (알려진 스킴이 없으므로 앱스토어로 바로 연결)
  window.location.href=store;
};

// 클래스룸 앱 열기 (설치돼 있으면 앱, 없으면 웹) --------------------
window.openClassroom=(e)=>{
  e.preventDefault();
  const t=Date.now();
  // 클래스룸 앱 URL 스킴 시도
  window.location.href='comgoogleclassroom://';
  // 앱이 없으면 잠시 후 웹으로
  setTimeout(()=>{ if(Date.now()-t<1500) window.location.href='https://classroom.google.com'; },800);
};

// ---------- 딴생각 주차장 ----------
window.openPark=()=>{
  renderParkModal();
  showModal();
};
function renderParkModal(){
  const items = state.parking||[];
  document.getElementById('modalBox').innerHTML = `
    <h3>🅿️ 딴생각 주차장</h3>
    <p style="font-size:13px;color:var(--ink2);margin:0 0 12px;line-height:1.5;">숙제하다 딴생각이 나면 여기 잠깐 세워둬요.<br>다 적었으면 다시 숙제로 돌아가면 돼요! 나중에 봐도 돼요 😊</p>
    <div style="display:flex;gap:8px;">
      <input id="park-in" placeholder="예: 이따 그림 그리기, 물 마시기…" style="flex:1;" onkeydown="if(event.key==='Enter')addPark()" />
      <button class="btn-save" style="flex:0 0 auto;padding:0 16px;border-radius:11px;" onclick="addPark()">세우기</button>
    </div>
    <div class="park-list" style="margin-top:14px;">
      ${items.length? items.map((p,i)=>`<div class="park-item"><div class="pt">${esc(p)}</div><button class="px" onclick="delPark(${i})">×</button></div>`).join('')
        : '<div class="empty" style="padding:20px 10px;">아직 세워둔 생각이 없어요 🌿</div>'}
    </div>
    <div class="m-actions"><button class="btn-cancel" onclick="closeModal()">닫기</button></div>`;
}
window.addPark=async()=>{
  const inp=document.getElementById('park-in'); const v=inp.value.trim();
  if(!v) return;
  state.parking=[...(state.parking||[]), v];
  inp.value='';
  await saveTasks(); renderParkModal(); updateParkBadge();
};
window.delPark=async(i)=>{
  state.parking.splice(i,1);
  await saveTasks(); renderParkModal(); updateParkBadge();
};
function updateParkBadge(){
  const b=document.getElementById('parkBadge'); if(!b) return;
  const n=(state.parking||[]).length;
  b.textContent=n; b.style.display = n>0? 'flex':'none';
}

// ---------- 엄마 관리자 모드 ----------
let editDays=[];
window.openAdd=()=>{
  if(role!=='parent') return;
  if(tab==='backlog'){ openBacklogEditor(); return; }
  editDays=[];
  document.getElementById('modalBox').innerHTML = `
    <h3>할 일 추가</h3>
    <label>할 일 이름</label>
    <input id="f-title" placeholder="예: 학교 숙제 (오늘분)" />
    <label>세부 범위 / 메모</label>
    <input id="f-range" placeholder="예: Math pg. 19~20" />
    <label>마감일 (선택 — 넣으면 D-day 표시)</label>
    <input id="f-due" type="date" />
    <label>요일 선택</label>
    <div class="chips" id="f-days">
      ${[[1,'월'],[2,'화'],[3,'수'],[4,'목'],[5,'금'],[6,'토'],[0,'일']].map(d=>`<button type="button" onclick="toggleDay(${d[0]},this)">${d[1]}</button>`).join('')}
    </div>
    <label>분류</label>
    <select id="f-tag"><option value="v">학교/필수</option><option value="g">학원/연습</option><option value="r">밀림</option></select>
    <div class="m-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveNewTask()">추가</button>
    </div>`;
  showModal();
};
window.toggleDay=(n,btn)=>{ const i=editDays.indexOf(n);
  if(i>=0){editDays.splice(i,1);btn.classList.remove('on');} else {editDays.push(n);btn.classList.add('on');} };
window.saveNewTask=async()=>{
  const title=document.getElementById('f-title').value.trim();
  if(!title){ alert('할 일 이름을 입력하세요'); return; }
  if(!editDays.length){ alert('요일을 하나 이상 선택하세요'); return; }
  state.tasks.push({ id:'t'+Date.now(), title, range:document.getElementById('f-range').value.trim(),
    days:[...editDays], tag:document.getElementById('f-tag').value,
    due:document.getElementById('f-due').value || undefined });
  closeModal(); await saveTasks();
};

window.openBacklogEditor=()=>{
  document.getElementById('modalBox').innerHTML = `
    <h3>밀린 과제 관리</h3>
    <div id="bl-list">${state.backlog.map((b,i)=>`
      <div class="admin-row">
        <input value="${esc(b.title)}" oninput="editBl(${i},'title',this.value)" />
        <input type="number" min="0" max="100" value="${b.pct||0}" style="flex:0 0 70px" oninput="editBl(${i},'pct',this.value)" />
        <button class="x" onclick="delBl(${i})">×</button>
      </div>`).join('')}</div>
    <button class="chips" style="border:1px dashed var(--line);background:#fff;border-radius:11px;padding:11px;width:100%;font-weight:700;color:var(--violet-ink)" onclick="addBl()">+ 밀린 과제 추가</button>
    <div class="m-actions">
      <button class="btn-cancel" onclick="closeModal()">닫기</button>
      <button class="btn-save" onclick="saveBl()">저장</button>
    </div>`;
  showModal();
};
window.editBl=(i,k,v)=>{ state.backlog[i][k] = k==='pct'? Math.max(0,Math.min(100,parseInt(v)||0)) : v; };
window.delBl=(i)=>{ state.backlog.splice(i,1); openBacklogEditor(); };
window.addBl=()=>{ state.backlog.push({id:'b'+Date.now(),title:'새 과제',pct:0}); openBacklogEditor(); };
window.saveBl=async()=>{ closeModal(); await saveTasks(); };

// 오늘 할 일 카드 롱프레스로 삭제 (엄마 모드) — 간단화: 관리자 안내만
function showModal(){ document.getElementById('modalBg').classList.add('show'); }
window.closeModal=()=>{ document.getElementById('modalBg').classList.remove('show'); };
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

render();
initFirebase();
</script>
</body>
</html>
