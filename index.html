<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{
    --ink:#3a3350; --ink2:#8b84a3; --line:#ece8f6; --paper:#f9f7fe;
    --violet:#8b6ee0; --violet-ink:#6849c0; --violet-soft:#f0ebfd;
    --red:#c85172; --red-soft:#fbe6ec; --orange:#b46a12; --orange-soft:#ffe9cf;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.5;}
  /* Netlify 광고 배지 숨김 */
  [class*="netlify"],[id*="netlify"],iframe[src*="netlify"],iframe[title*="etlify"],a[href*="netlify.com"],
  [data-netlify-badge]{display:none !important;}
  .wrap{max-width:480px;margin:0 auto;padding:28px 16px 40px;}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
  .hi{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;}
  .date{font-size:14px;color:var(--ink2);font-weight:600;margin-top:4px;}
  .avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #fff;
    box-shadow:0 3px 10px rgba(109,92,224,.2);cursor:pointer;flex:0 0 auto;}

  .progress{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .bar{flex:1;height:10px;background:#e9e3f8;border-radius:10px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--violet);border-radius:10px;transition:width .4s ease;}
  .count{font-size:14px;font-weight:800;color:var(--violet-ink);white-space:nowrap;}

  .item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
    border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer;user-select:none;transition:background .15s;}
  .check{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2.5px solid #d9d2ec;
    display:flex;align-items:center;justify-content:center;transition:.15s;}
  .check svg{width:16px;height:16px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  .body{flex:1;min-width:0;}
  .ttl{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.35;}
  .rng{font-size:13.5px;color:var(--ink2);margin-top:2px;word-break:break-word;white-space:pre-line;}
  .dd{flex:0 0 auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .dd.over,.dd.today{background:var(--red-soft);color:var(--red);}
  .dd.soon{background:var(--orange-soft);color:var(--orange);}
  .dd.far{background:var(--violet-soft);color:var(--violet-ink);}

  .item.done{background:transparent;border-color:transparent;padding-top:10px;padding-bottom:10px;}
  .item.done .check{background:var(--violet);border-color:var(--violet);}
  .item.done .check svg{opacity:1;}
  .item.done .ttl{color:var(--ink2);text-decoration:line-through;font-weight:600;}
  .item.done .rng{display:none;}

  .notice{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden;}
  .notice summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;}
  .notice summary::-webkit-details-marker{display:none;}
  .notice summary .t{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:600;}
  .notice summary .arrow{font-size:12px;color:var(--violet-ink);transition:transform .2s;}
  .notice[open] summary .arrow{transform:rotate(180deg);}
  .notice .txt{padding:0 16px 16px;font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-line;word-break:break-word;}
  .notice .txt + .txt{border-top:1px dashed var(--line);padding-top:12px;}
  .done-label{font-size:13px;font-weight:700;color:var(--ink2);margin:22px 4px 4px;}
  .all-done{text-align:center;padding:30px 10px;font-size:17px;font-weight:800;color:var(--violet-ink);}
  .all-done .em{font-size:40px;display:block;margin-bottom:6px;}

  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px;font-size:12px;color:var(--ink2);}
  .foot a{color:var(--violet-ink);font-weight:700;text-decoration:none;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9c4d8;margin-right:5px;vertical-align:middle;}
  .dot.live{background:#5aa672;}

  .cheer{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.85);z-index:80;opacity:0;pointer-events:none;
    background:#fff;border-radius:24px;padding:22px 26px;text-align:center;max-width:280px;width:80%;
    box-shadow:0 16px 40px rgba(109,92,224,.25);transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1);}
  .cheer.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .cheer .en{font-weight:800;font-size:16px;color:var(--violet-ink);line-height:1.35;}
  .cheer .ko{font-size:14px;font-weight:600;color:var(--ink2);margin-top:6px;}

  .modal-bg{position:fixed;inset:0;background:rgba(43,39,64,.45);display:none;align-items:flex-end;justify-content:center;z-index:60;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;}
  .modal h3{margin:0 0 14px;font-size:17px;font-weight:800;}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 5px;}
  .modal input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:15px;font-family:inherit;background:var(--paper);}
  .row{padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;}
  .row small{display:block;color:var(--ink2);font-weight:500;}
  .btns{display:flex;gap:8px;margin-top:18px;}
  .btns button,.add-btn{flex:1;border-radius:12px;padding:13px;font-size:15px;font-weight:800;border:0;font-family:inherit;}
  .btn-save{background:var(--violet);color:#fff;}
  .btn-cancel{background:#f2eefa;color:var(--ink2);}
  .add-btn{width:100%;margin-top:6px;background:#fff;border:1.5px dashed #d9d2ec;color:var(--violet-ink);}
  .del-btn{width:100%;margin-top:10px;background:none;border:0;color:var(--red);font-size:13px;font-weight:700;font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="hi">Hi, Yuna! ✨</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyCeoUrRyb5Q0kfj63pU5lQo_oEwNjIGQeQ",
  authDomain: "yuna-homework.firebaseapp.com",
  projectId: "yuna-homework",
  storageBucket: "yuna-homework.firebasestorage.app",
  messagingSenderId: "224203197846",
  appId: "1:224203197846:web:05d9a4558ea2ecf98f61b7"
};

// ====================================================================
//  학교 숙제 — auto_update/update_homework.py 가 클래스룸 공지를 읽어 자동으로 채웁니다.
//  (@auto-start ~ @auto-end 사이와 TASKS_VERSION은 직접 고치지 마세요)
//  TASKS_VERSION이 Firebase에 저장된 값보다 크면 모든 기기에서 학교 숙제가 이 목록으로 바뀝니다.
//  과외·학원 숙제는 앱의 '+ 과외·학원 숙제 추가'로 등록 (Firebase에 저장, 자동 반영과 무관)
// ====================================================================
// @auto-start
const TASKS_VERSION = 202610161600;
const SCHOOL_TASKS = [
  {"id": "readin1016", "title": "Reading (읽기)", "range": "(for Monday)\nMy View pg. 192 (rewrite and correct the paragraph)\npg. 193 (fill in the blanks to complete the paragraph)\nWB pg. 44, 45, 47-50, questions 1-13; Writing Narrative on pg. 51 (2 paragraphs with dial…", "due": "2026-10-19", "tag": "v"},
  {"id": "scienc1016", "title": "Science (과학)", "range": "Ball Drop Experiment Reflection (for Monday)", "due": "2026-10-19", "tag": "v"},
  {"id": "vocabu1016", "title": "Vocabulary", "range": "(for Tuesday)\nReview Unit 5 words pg 48-49\nDo pg. 50-51", "due": "2026-10-20", "tag": "v"},
];
const NOTICES = [
];
// @auto-end

const DEFAULT_TASKS = [...SCHOOL_TASKS];

// 새 학교 숙제 목록 + 엄마가 직접 등록한 과외·학원 숙제(manual) 합치기
function upgradeTasks(oldTasks){
  const keep = (oldTasks||[]).filter(t=>t.manual);
  return [...JSON.parse(JSON.stringify(SCHOOL_TASKS)), ...JSON.parse(JSON.stringify(keep))];
}
const ver = v => Number(v)||0;   // 예전 '2026-10-14a' 같은 문자열은 0 취급
// ====================================================================

const DAYS = ["일","월","화","수","목","금","토"];
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => dateKey(new Date());
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state = { tasks:clone(DEFAULT_TASKS), checks:{}, parking:[] };
let db=null, fb=null;

// ---------- 저장소 (Firebase 실시간, 실패 시 이 기기에만) ----------
function loadLocal(){
  try{
    const s=JSON.parse(localStorage.getItem('yuna_state')||'null');
    if(s){ state.parking=s.parking||[];
      state.tasks = ver(s.version) >= TASKS_VERSION ? (s.tasks||state.tasks) : upgradeTasks(s.tasks); }
    state.checks=JSON.parse(localStorage.getItem('yuna_checks')||'{}');
  }catch(e){}
}
function saveLocal(){
  try{
    localStorage.setItem('yuna_state',JSON.stringify({tasks:state.tasks,parking:state.parking,version:TASKS_VERSION}));
    localStorage.setItem('yuna_checks',JSON.stringify(state.checks));
  }catch(e){}
}
async function saveTasks(){
  saveLocal();
  if(db&&fb){ try{ await fb.setDoc(fb.doc(db,'yuna','data'),{tasks:state.tasks,backlog:[],parking:state.parking||[],version:TASKS_VERSION}); }catch(e){} }
}
async function saveChecks(){
  saveLocal();
  if(db&&fb){ try{ await fb.setDoc(fb.doc(db,'yuna','checks'),{map:state.checks}); }catch(e){} }
}
function setStatus(on,txt){
  document.getElementById('liveDot').classList.toggle('live',on);
  document.getElementById('statusText').textContent=txt;
}

async function initFirebase(){
  try{
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    fb = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    db = fb.getFirestore(appMod.initializeApp(firebaseConfig));
    fb.onSnapshot(fb.doc(db,'yuna','data'), snap=>{
      const d = snap.exists()? snap.data() : {};
      if(ver(d.version) < TASKS_VERSION){
        // 이 파일의 학교 숙제가 더 최신 → 모두에게 반영 (반복·직접추가 항목은 유지)
        state.tasks = upgradeTasks(d.tasks); state.parking = d.parking||[];
        saveTasks();
      } else {
        if(d.tasks) state.tasks=d.tasks;
        if(d.parking) state.parking=d.parking;
      }
      setStatus(true,'엄마·아빠와 함께 보는 중'); render();
    }, ()=> setStatus(false,'연결 오류 — 새로고침 해보세요'));
    fb.onSnapshot(fb.doc(db,'yuna','checks'), snap=>{
      state.checks = snap.exists()? (snap.data().map||{}) : {};
      render();
    });
  }catch(e){ setStatus(false,'오프라인 — 이 기기에만 저장돼요'); }
}

// ---------- 오늘 할 일 ----------
function isDone(t){
  const c = state.checks[t.id];
  if(!c) return false;
  return t.repeat ? c===todayKey() : true;   // 반복 항목은 오늘 체크한 것만 완료
}
function visibleTasks(){
  const dow = new Date().getDay();
  return state.tasks.filter(t=>{
    if(t.repeat) return (t.days||[]).includes(dow);
    const c = state.checks[t.id];
    return !c || c===todayKey();             // 학교 숙제: 할 때까지 보이고, 완료는 그날만 보임
  });
}
function dueBadge(due){
  if(!due) return '';
  const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((new Date(due+'T00:00:00')-now)/86400000);
  const [label,cls] = diff<0?['지났어요','over'] : diff===0?['오늘까지','today'] : diff===1?['내일까지','soon'] : ['D-'+diff,'far'];
  return `<span class="dd ${cls}">${label}</span>`;
}
const CHECK = '<svg viewBox="0 0 20 20"><polyline points="4,10 8,14 16,5"/></svg>';
function card(t,done){
  return `<div class="item ${done?'done':''}" onclick="toggleCheck('${t.id}')">
    <div class="check">${CHECK}</div>
    <div class="body"><div class="ttl">${esc(t.title)}</div>${t.range?`<div class="rng">${esc(t.range)}</div>`:''}</div>
    ${done?'':dueBadge(t.due)}
  </div>`;
}

function render(){
  const d=new Date();
  document.getElementById('dateLine').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;

  const all = visibleTasks();
  const dueVal = t => t.due ? new Date(t.due+'T00:00:00').getTime() : Infinity;
  const todo = all.filter(t=>!isDone(t)).sort((a,b)=> (!!b.pin-!!a.pin) || (dueVal(a)-dueVal(b)));
  const done = all.filter(isDone);

  const total = all.length;
  document.getElementById('count').textContent = `${done.length} / ${total} 완료`;
  document.getElementById('bar').style.width = total ? (done.length/total*100)+'%' : '0%';

  let html = todo.length ? todo.map(t=>card(t,false)).join('')
                         : `<div class="all-done"><span class="em">🎉</span>오늘 할 일 끝! 최고야, 윤아!</div>`;
  if(done.length) html += `<div class="done-label">다 한 것</div>` + done.map(t=>card(t,true)).join('');
  document.getElementById('list').innerHTML = html;

  // 오늘 올라온 선생님 공지 (탭하면 펼침)
  const notes = NOTICES.filter(n=>n.date===todayKey());
  const box = document.getElementById('notice');
  const wasOpen = !!box.querySelector('details[open]');
  box.innerHTML = notes.length ? `<details class="notice" ${wasOpen?'open':''}>
      <summary>📢 오늘 선생님 공지${notes.length>1?` ${notes.length}개`:''}<span class="t">${notes[notes.length-1].time}</span><span class="arrow">▼</span></summary>
      ${notes.map(n=>`<div class="txt">${esc(n.text)}</div>`).join('')}
    </details>` : '';
}

// ---------- 체크 + 응원 ----------
const CHEERS = [
  ['You are capable of amazing things.','너는 멋진 일들을 해낼 수 있어 ✨'],
  ['You are braver than you think.','넌 생각보다 훨씬 용감해 🦁'],
  ['Believe in yourself. You can do it.','너 자신을 믿어. 넌 할 수 있어! ⭐'],
  ['You are growing into someone wonderful.','너는 멋진 사람으로 자라고 있어 🌱'],
  ['She believed she could, so she did!','넌 해낼 거라 믿었고, 그래서 해냈어! 🌷'],
  ["You don't have to be perfect to be amazing.",'완벽하지 않아도 충분히 멋져 💗'],
];
function showCheer(){
  const [en,ko]=CHEERS[Math.floor(Math.random()*CHEERS.length)];
  const box=document.getElementById('cheer');
  box.innerHTML=`<div class="en">${en}</div><div class="ko">${ko}</div>`;
  box.classList.add('show');
  clearTimeout(window._cheerT);
  window._cheerT=setTimeout(()=>box.classList.remove('show'),1800);
}
window.toggleCheck = async id=>{
  const t = state.tasks.find(x=>x.id===id);
  if(t && isDone(t)) delete state.checks[id];
  else { state.checks[id]=todayKey(); showCheer(); }
  render(); await saveChecks();
};

// ---------- 보호자 관리 (사진 누르기 → 비밀번호) ----------
const PARENT_PW = '3578';
window.openManage=()=>{
  const pw = prompt('관리 비밀번호를 입력하세요');
  if(pw===null) return;
  if(pw!==PARENT_PW){ alert('비밀번호가 맞지 않아요'); return; }
  renderManage(); showModal();
};
function renderManage(){
  document.getElementById('modalBox').innerHTML = `
    <h3>⚙️ 할 일 관리</h3>
    ${state.tasks.map(t=>`<div class="row" onclick="openEdit('${t.id}')">${esc(t.title)}
      <small>${t.repeat? '매주 '+(t.days||[]).map(n=>DAYS[n]).join('·') : (t.due? '마감 '+t.due.slice(5).replace('-','/') : '')}</small></div>`).join('')}
    <button class="add-btn" onclick="openEdit()">+ 할 일 추가</button>
    <div class="btns"><button class="btn-cancel" onclick="closeModal()">닫기</button></div>`;
}
let editFromMain = false;   // 메인 화면에서 바로 추가한 경우 저장 후 창 닫기
const backFromEdit = () => editFromMain ? closeModal() : renderManage();
window.cancelEdit = () => backFromEdit();
window.openEdit=(id,fromMain=false)=>{
  editFromMain = fromMain;
  const t = id ? state.tasks.find(x=>x.id===id) : {title:'',range:'',due:''};
  document.getElementById('modalBox').innerHTML = `
    <h3>${id?'✏️ 수정':'➕ 과외·학원 숙제 추가'}</h3>
    <label>할 일</label><input id="e-title" value="${esc(t.title)}" placeholder="예: 수학과외 숙제" />
    <label>범위 / 메모</label><input id="e-range" value="${esc(t.range)}" placeholder="예: 4-1) 66~68쪽" />
    ${t.repeat?'':`<label>마감일 <span style="font-weight:500">(비우면 다 할 때까지 계속 보여요)</span></label><input id="e-due" type="date" value="${t.due||''}" />`}
    <div class="btns">
      <button class="btn-cancel" onclick="cancelEdit()">취소</button>
      <button class="btn-save" onclick="saveEdit('${id||''}')">저장</button>
    </div>
    ${id?`<button class="del-btn" onclick="deleteTask('${id}')">🗑 삭제</button>`:''}`;
  showModal();
};
window.saveEdit=async id=>{
  const title=document.getElementById('e-title').value.trim();
  if(!title){ alert('할 일을 입력하세요'); return; }
  const range=document.getElementById('e-range').value.trim();
  const dueEl=document.getElementById('e-due'); const due = dueEl ? dueEl.value : undefined;
  if(id){
    const t=state.tasks.find(x=>x.id===id); t.title=title; t.range=range;
    if(dueEl){ if(due) t.due=due; else delete t.due; }
  } else {
    const t={ id:'t'+Date.now(), title, range, tag:'v', manual:true }; if(due) t.due=due;
    state.tasks.push(t);
  }
  render(); await saveTasks(); backFromEdit();
};
window.deleteTask=async id=>{
  if(!confirm('이 항목을 삭제할까요?')) return;
  state.tasks=state.tasks.filter(x=>x.id!==id); delete state.checks[id];
  render(); await saveTasks(); await saveChecks(); renderManage();
};
function showModal(){ document.getElementById('modalBg').classList.add('show'); }
window.closeModal=()=>document.getElementById('modalBg').classList.remove('show');
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

// ---------- 클래스룸 앱 열기 (없으면 웹) ----------
window.openClassroom=e=>{
  e.preventDefault();
  const t=Date.now();
  window.location.href='comgoogleclassroom://';
  setTimeout(()=>{ if(Date.now()-t<1500) window.location.href='https://classroom.google.com'; },800);
};

// ---------- Netlify 배지 제거 ----------
function killNetlifyBadge(){
  document.querySelectorAll('iframe,div,a').forEach(el=>{
    const s=(el.src||'')+(el.href||'')+(el.title||'')+(el.className||'')+(el.id||'');
    if(/netlify/i.test(s) && !el.closest('.wrap')) el.remove();
  });
}
new MutationObserver(killNetlifyBadge).observe(document.body,{childList:true,subtree:true});

loadLocal(); render(); initFirebase();
// 자정이 지나면 날짜·반복 항목 갱신
setInterval(()=>{ if(document.getElementById('dateLine').dataset.k!==todayKey()){ document.getElementById('dateLine').dataset.k=todayKey(); render(); } }, 60000);
</script>
